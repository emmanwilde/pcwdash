<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Builder Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="nav-left">
            <button id="build-btn" class="nav-btn active">BUILD</button>
            <button id="category-btn" class="nav-btn">CATEGORY</button>
            <button id="inventory-btn" class="nav-btn">INVENTORY</button>
        </div>
        <div class="nav-right">
            <span id="current-datetime"></span>
            <div class="theme-switcher">
                <label for="theme-toggle">☀️</label>
                <input type="checkbox" id="theme-toggle">
                <label for="theme-toggle">🌙</label>
            </div>
        </div>
    </nav>

    <main>
                    <div id="build-page" class="page active">
                        <select id="preset-dropdown" class="basic-dropdown">
                            <!-- Options will be generated by JavaScript -->
                        </select>
                        <div class="build-container">
                            <div id="build-left" class="build-section">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>COMPONENTS</th>
                                            <th>DESCRIPTION</th>
                                            <th>ITEM CODE</th>
                                        </tr>
                                    </thead>
                                        <tbody id="build-table-body">
                                            <!-- Rows will be generated by JavaScript -->
                                        </tbody>
                                    </table>
                                    <button id="save-build-btn" class="nav-btn" style="width: 100%; margin-top: 20px;">SAVE BUILD</button>
                                </div>
                            <div id="build-right" class="build-section">
                                <h3>BUILD SUMMARY</h3>
                                <textarea id="summary-textbox" placeholder="Selected components will be listed here..." spellcheck="false"></textarea>
                            </div>
                        </div>
                    </div>
        <div id="category-page" class="page">
            <div class="category-header">
                <h2>Manage Categories</h2>
                <div class="category-actions">
                    <button id="export-cat-btn" class="nav-btn">Export Categories</button>
                    <button id="import-cat-btn" class="nav-btn">Import Categories</button>
                    <input type="file" id="category-file-input" accept=".json" style="display: none;">
                    <span id="imported-cat-filename" style="font-size: 0.8em; color: #888; margin-top: 5px;"></span>
                </div>
            </div>
            <div id="category-grid">
                <!-- Category editors will be generated by JavaScript -->
            </div>
            <div id="preset-editor-container">
                <!-- Preset editors will be generated here -->
            </div>
        </div>

        <div id="inventory-page" class="page">
            <div class="inventory-sections-container">
                <div class="inventory-section">
                    <h2>BRANCH STOCK</h2>
                    <p class="stock-info"><span id="branch-file-text"></span> - <span id="branch-file-date"></span></p>
                    <div class="inventory-filters">
                        <input type="text" id="branch-item-code-filter" placeholder="Filter by Item Code...">
                        <input type="text" id="branch-description-filter" placeholder="Filter by Description (1)...">
                        <input type="text" id="branch-description-filter2" placeholder="Filter by Description (2)...">
                        <button id="branch-import-btn" class="nav-btn">IMPORT BRANCH</button>
                        <input type="file" id="branch-file-input" accept=".xlsx, .xls" style="display: none;">
                    </div>
                    <div class="table-container">
                        <table id="branch-stock-table">
                            <thead>
                                <tr>
                                    <th>ITEM CODE</th>
                                    <th>DESCRIPTION</th>
                                    <th>QTY</th>
                                </tr>
                            </thead>
                            <tbody id="branch-stock-table-body">
                                <!-- Branch stock data will be populated here -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="inventory-section">
                    <h2>WHS STOCK</h2>
                    <p class="stock-info"><span id="whs-file-text"></span> - <span id="whs-file-date"></span></p>
                    <div class="inventory-filters">
                        <input type="text" id="whs-item-code-filter" placeholder="Filter by Item Code...">
                        <input type="text" id="whs-description-filter" placeholder="Filter by Description (1)...">
                        <input type="text" id="whs-description-filter2" placeholder="Filter by Description (2)...">
                        <button id="whs-import-btn" class="nav-btn">IMPORT WHS</button>
                        <input type="file" id="whs-file-input" accept=".xlsx, .xls" style="display: none;">
                    </div>
                    <div class="table-container">
                        <table id="whs-stock-table">
                            <thead>
                                <tr>
                                    <th>ITEM CODE</th>
                                    <th>DESCRIPTION</th>
                                    <th>QTY</th>
                                </tr>
                            </thead>
                            <tbody id="whs-stock-table-body">
                                <!-- WHS stock data will be populated here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- XLSX Library for Excel file reading -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Main application script -->
    <script src="script.js"></script>

    <!-- Save Build Modal -->
    <div id="save-build-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Save Current Build as Preset</h3>
            <input type="text" id="preset-name-input" placeholder="Enter preset name" />
            <div class="modal-actions">
                <button id="modal-save-btn" class="nav-btn">Save</button>
                <button id="modal-cancel-btn" class="nav-btn">Cancel</button>
            </div>
        </div>
    </div>
</body>
</html>
